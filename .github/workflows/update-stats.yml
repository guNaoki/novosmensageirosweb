name: Atualização Automática de Métricas Sociais

on:
  schedule:
    - cron: '0 0 * * 0' # Executa todo domingo à meia-noite
  workflow_dispatch: # Permite rodar manualmente com 1 clique na aba Actions do GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar script de atualização
        run: node scripts/update-stats.js

      - name: Commitar e enviar se houver alteração
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizacao automatica das metricas sociais [skip ci]" && git push)
