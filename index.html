    <!-- Primary Meta Tags -->
    <title>Novos Mensageiros — Portal de Acolhimento e Projeto Resgate</title>
    <meta name="title" content="Novos Mensageiros — Portal de Acolhimento e Projeto Resgate" />
    <meta name="description" content="Iniciativa voltada ao acolhimento fraterno, consolo espiritual e resgate de vidas a partir do ambiente digital. Conheça o Espiritismo e faça parte da nossa rede de apoio voluntária." />
    <meta name="theme-color" content="#004d8f" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook / WhatsApp -->
